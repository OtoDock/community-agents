name: Validate templates

# The catalog's own contract, on every push and pull request: registry.json
# matches the templates, and every template passes the schema the platform
# installs against (mcps/agent-template.schema.json of OtoDock/oto-dock,
# fetched at the latest release and checked against its sha256: its id names
# the release, so the two values move together after every publish, and the
# platform's release gate reports a pin that lags). Every department set
# (<slug>/department.json) passes mcps/department.schema.json the same way.
# This file lives in the PREP repo and is synced to the public catalog by
# dev/publish-catalog.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SCHEMA_URL: https://raw.githubusercontent.com/OtoDock/oto-dock/v2.0.0/mcps/agent-template.schema.json
  SCHEMA_SHA256: c7541c18225a9753d7f80f367110927a0f765b66c8dbf2bbb4349fb256b5f5df
  DEPARTMENT_SCHEMA_URL: https://raw.githubusercontent.com/OtoDock/oto-dock/v2.0.0/mcps/department.schema.json
  DEPARTMENT_SCHEMA_SHA256: 04d29ac6b6e8c9704acbe0423797a07f614036ce2b2f32c3986eb43521ab4889
  # The writing check of OtoDock/oto-dock (its WRITING.md is the rules page):
  # the check's two files at a full commit of that repository's main, each
  # checked against its sha256. The platform's release gate reports a pin
  # that lags.
  PROSE_URL: https://raw.githubusercontent.com/OtoDock/oto-dock/e67d0240025401f34906a01c5f59ad97a1e997a2/scripts/prose
  PROSE_CHECK_SHA256: f3ba0196f6f4ac2e6b726e5da969b0e9a4bb28e364cf287fd945da587d85af76
  PROSE_RULES_SHA256: ee3c9dcf5e649f0df20e1d0d39e22377b95f923398eb697b3ea8f6528957efd0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check registry is up to date
        run: python3 scripts/generate-registry.py --check
      - name: The platform's template schema
        run: |
          curl -fsSLo "$RUNNER_TEMP/agent-template.schema.json" "$SCHEMA_URL"
          echo "$SCHEMA_SHA256  $RUNNER_TEMP/agent-template.schema.json" | sha256sum -c -
          echo "OTODOCK_TEMPLATE_SCHEMA=$RUNNER_TEMP/agent-template.schema.json" >> "$GITHUB_ENV"
          curl -fsSLo "$RUNNER_TEMP/department.schema.json" "$DEPARTMENT_SCHEMA_URL"
          echo "$DEPARTMENT_SCHEMA_SHA256  $RUNNER_TEMP/department.schema.json" | sha256sum -c -
          echo "OTODOCK_DEPARTMENT_SCHEMA=$RUNNER_TEMP/department.schema.json" >> "$GITHUB_ENV"
      - name: Every template follows the schema
        run: |
          python3 -m pip install -q "jsonschema==4.26.0"
          python3 - <<'PY'
          import fnmatch, json, os, pathlib, sys
          from jsonschema import Draft202012Validator
          schema = json.loads(pathlib.Path(os.environ["OTODOCK_TEMPLATE_SCHEMA"]).read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          patterns = [str(p).split("/") for p in schema.get("x-otodock-documents") or []]
          def entries(folder):
              try:
                  return sorted(os.scandir(folder), key=lambda e: e.name)
              except OSError:
                  return []
          def expand(folder, parts, prefix=""):
              head, rest = parts[0], parts[1:]
              for entry in entries(folder):
                  if entry.name.startswith(".") or not fnmatch.fnmatchcase(entry.name, head):
                      continue
                  rel = f"{prefix}{entry.name}"
                  if rest:
                      if entry.is_dir(follow_symlinks=False):
                          yield from expand(pathlib.Path(entry.path), rest, rel + "/")
                  elif not entry.is_dir(follow_symlinks=False):
                      yield rel
          bad = 0
          folders = sorted(p.parent for p in pathlib.Path(".").glob("*/agent.json"))
          for folder in folders:
              document, named = {}, set()
              for parts in patterns:
                  for rel in expand(folder, parts):
                      named.add(rel)
                      try:
                          document[rel] = json.loads((folder / rel).read_text(encoding="utf-8"))
                      except ValueError as exc:
                          print(f"{folder.name}: invalid JSON in {rel}: {exc}"); bad += 1
              for entry in entries(folder):
                  if not entry.name.startswith(".") and entry.name not in named and entry.is_file(follow_symlinks=False):
                      document[entry.name] = True
              for e in sorted(validator.iter_errors(document), key=lambda e: [str(p) for p in e.absolute_path]):
                  where = "/".join(str(p) for p in e.absolute_path) or "(document)"
                  print(f"{folder.name}: {where}: {e.message}"); bad += 1
          print(f"{len(folders)} template(s), {bad} problem(s)")
          sys.exit(1 if bad else 0)
          PY
      - name: Every department set follows the schema
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from jsonschema import Draft202012Validator
          schema = json.loads(pathlib.Path(os.environ["OTODOCK_DEPARTMENT_SCHEMA"]).read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          bad = 0
          sets = sorted(pathlib.Path(".").glob("*/department.json"))
          for path in sets:
              try:
                  document = json.loads(path.read_text(encoding="utf-8"))
              except ValueError as exc:
                  print(f"{path.parent.name}: invalid JSON in department.json: {exc}"); bad += 1
                  continue
              for e in sorted(validator.iter_errors(document), key=lambda e: [str(p) for p in e.absolute_path]):
                  where = "/".join(str(p) for p in e.absolute_path) or "(document)"
                  print(f"{path.parent.name}: {where}: {e.message}"); bad += 1
          print(f"{len(sets)} department set(s), {bad} problem(s)")
          sys.exit(1 if bad else 0)
          PY

  # Every page of this catalog that is written for people follows the writing
  # rules: the files .prose.json names, on the oldest Python the check
  # promises. The check's two files land outside the workspace. Standard
  # library only: nothing to install.
  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: The writing check
        run: |
          mkdir -p "$RUNNER_TEMP/prose"
          curl -fsSLo "$RUNNER_TEMP/prose/prose_check.py" "$PROSE_URL/prose_check.py"
          curl -fsSLo "$RUNNER_TEMP/prose/rules.json" "$PROSE_URL/rules.json"
          echo "$PROSE_CHECK_SHA256  $RUNNER_TEMP/prose/prose_check.py" | sha256sum -c -
          echo "$PROSE_RULES_SHA256  $RUNNER_TEMP/prose/rules.json" | sha256sum -c -
      - name: The check tests itself
        run: python "$RUNNER_TEMP/prose/prose_check.py" --self-test
      - name: Every page follows the writing rules
        # A nested .prose.json would exempt its folder: none belongs here.
        run: python "$RUNNER_TEMP/prose/prose_check.py" . --no-nested
